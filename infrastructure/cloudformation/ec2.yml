AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Banking System - Phase 10
  VPC + Public Subnet + Internet Gateway + EC2 + IAM

Parameters:

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 KeyPair

Resources:

  # =========================================================
  # VPC
  # =========================================================

  BankingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

      Tags:
        - Key: Name
          Value: banking-vpc


  # =========================================================
  # INTERNET GATEWAY
  # =========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: banking-igw


  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref BankingVPC
      InternetGatewayId: !Ref InternetGateway


  # =========================================================
  # PUBLIC SUBNET
  # =========================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref BankingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: banking-public-subnet


  # =========================================================
  # ROUTE TABLE
  # =========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref BankingVPC

      Tags:
        - Key: Name
          Value: banking-public-route-table


  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn: AttachInternetGateway

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # =========================================================
  # SECURITY GROUP
  # =========================================================

  BankingSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Banking application security group
      VpcId: !Ref BankingVPC

      SecurityGroupIngress:

        # Spring Boot Gateway
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: banking-security-group


  # =========================================================
  # IAM ROLE FOR EC2
  # =========================================================

  EC2Role:
    Type: AWS::IAM::Role

    Properties:
      RoleName: banking-ec2-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        # SSM
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

        # ECR pull
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly


      Policies:

        - PolicyName: BankingSecretsRead

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - secretsmanager:GetSecretValue

                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:banking/*


  # =========================================================
  # INSTANCE PROFILE
  # =========================================================

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: banking-ec2-profile
      Roles:
        - !Ref EC2Role


  # =========================================================
  # EC2
  # =========================================================

  BankingEC2:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: !Ref InstanceType

      KeyName: !Ref KeyName

      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

      IamInstanceProfile: !Ref EC2InstanceProfile

      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref BankingSecurityGroup

      Tags:

        - Key: Name
          Value: banking-ec2

      UserData:
        Fn::Base64: |
          #!/bin/bash

          set -e

          echo "================================="
          echo "Banking EC2 initialization"
          echo "================================="

          # Update system
          dnf update -y

          # Install Docker
          dnf install -y docker

          # Start Docker
          systemctl enable docker
          systemctl start docker

          # Allow ec2-user to use Docker
          usermod -aG docker ec2-user

          # Install Docker Compose plugin
          mkdir -p /usr/local/lib/docker/cli-plugins

          curl -SL \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose

          chmod +x \
            /usr/local/lib/docker/cli-plugins/docker-compose

          # Install Git
          dnf install -y git

          echo "================================="
          echo "Docker version"
          echo "================================="

          docker --version

          echo "================================="
          echo "Docker Compose version"
          echo "================================="

          docker compose version

          echo "================================="
          echo "EC2 initialization completed"
          echo "================================="


Outputs:

  VPCId:
    Description: Banking VPC ID
    Value: !Ref BankingVPC


  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet


  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref BankingSecurityGroup


  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref BankingEC2


  EC2PublicIp:
    Description: EC2 Public IP
    Value: !GetAtt BankingEC2.PublicIp


  EC2RoleArn:
    Description: EC2 IAM Role ARN
    Value: !GetAtt EC2Role.Arn