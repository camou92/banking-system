name: Banking CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "091708608610"
  ECR_REGISTRY: 091708608610.dkr.ecr.eu-north-1.amazonaws.com
  ECR_NAMESPACE: banking
  CF_STACK_NAME: banking-infrastructure

jobs:

  # ==========================================================
  # 1. TEST OIDC
  # ==========================================================

  oidc-test:
    name: Test GitHub OIDC
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get OIDC claims
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            event_name
          }'


  # ==========================================================
  # 2. DETECT CHANGES
  # ==========================================================

  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      account: ${{ steps.filter.outputs.account }}
      transaction: ${{ steps.filter.outputs.transaction }}
      fraud: ${{ steps.filter.outputs.fraud }}
      notification: ${{ steps.filter.outputs.notification }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway: ${{ steps.filter.outputs.gateway }}
      compose: ${{ steps.filter.outputs.compose }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |

            account:
              - 'account-service/**'

            transaction:
              - 'transaction-service/**'

            fraud:
              - 'fraud-detection-service/**'

            notification:
              - 'notification-service/**'

            payment:
              - 'payment-service/**'

            gateway:
              - 'api-gateway/**'

            compose:
              - 'infrastructure/docker-compose-prod.yml'

            infrastructure:
              - 'infrastructure/cloudformation/**'


  # ==========================================================
  # 3. ACCOUNT SERVICE
  # ==========================================================

  account-service:
    name: Build & Push account-service
    needs: changes

    if: needs.changes.outputs.account == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./account-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/account-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/account-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 4. TRANSACTION SERVICE
  # ==========================================================

  transaction-service:
    name: Build & Push transaction-service
    needs: changes

    if: needs.changes.outputs.transaction == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./transaction-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/transaction-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/transaction-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 5. FRAUD DETECTION SERVICE
  # ==========================================================

  fraud-detection-service:
    name: Build & Push fraud-detection-service
    needs: changes

    if: needs.changes.outputs.fraud == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./fraud-detection-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/fraud-detection-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/fraud-detection-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 6. NOTIFICATION SERVICE
  # ==========================================================

  notification-service:
    name: Build & Push notification-service
    needs: changes

    if: needs.changes.outputs.notification == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/notification-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/notification-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 7. PAYMENT SERVICE
  # ==========================================================

  payment-service:
    name: Build & Push payment-service
    needs: changes

    if: needs.changes.outputs.payment == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/payment-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 8. API GATEWAY
  # ==========================================================

  gateway-service:
    name: Build & Push gateway-service
    needs: changes

    if: needs.changes.outputs.gateway == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/gateway-service:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/gateway-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 9. CLOUDFORMATION
  # ==========================================================

  infrastructure:
    name: Deploy CloudFormation
    needs: changes

    if: needs.changes.outputs.infrastructure == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS deploy credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/ec2.yml

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/ec2.yml \
            --stack-name ${{ env.CF_STACK_NAME }} \
            --parameter-overrides \
              KeyName=banking-key \
              InstanceType=t3.micro \
            --capabilities CAPABILITY_NAMED_IAM


  # ==========================================================
  # 10. DEPLOY APPLICATION
  # ==========================================================

  deploy:
    name: Deploy application to EC2

    needs:
      - changes
      - account-service
      - transaction-service
      - fraud-detection-service
      - notification-service
      - payment-service
      - gateway-service
      - infrastructure

    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.account == 'true' ||
        needs.changes.outputs.transaction == 'true' ||
        needs.changes.outputs.fraud == 'true' ||
        needs.changes.outputs.notification == 'true' ||
        needs.changes.outputs.payment == 'true' ||
        needs.changes.outputs.gateway == 'true' ||
        needs.changes.outputs.compose == 'true' ||
        needs.changes.outputs.infrastructure == 'true'
      ) &&
      (
        needs.account-service.result == 'success' ||
        needs.account-service.result == 'skipped'
      ) &&
      (
        needs.transaction-service.result == 'success' ||
        needs.transaction-service.result == 'skipped'
      ) &&
      (
        needs.fraud-detection-service.result == 'success' ||
        needs.fraud-detection-service.result == 'skipped'
      ) &&
      (
        needs.notification-service.result == 'success' ||
        needs.notification-service.result == 'skipped'
      ) &&
      (
        needs.payment-service.result == 'success' ||
        needs.payment-service.result == 'skipped'
      ) &&
      (
        needs.gateway-service.result == 'success' ||
        needs.gateway-service.result == 'skipped'
      ) &&
      (
        needs.infrastructure.result == 'success' ||
        needs.infrastructure.result == 'skipped'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS DEPLOY ROLE
      # --------------------------------------------------------

      - name: Configure AWS deploy credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::091708608610:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # GET EC2 INSTANCE ID
      # --------------------------------------------------------

      - name: Get EC2 instance ID
        id: ec2
        run: |

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CF_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='EC2InstanceId'].OutputValue" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "EC2 instance ID not found in CloudFormation outputs."
            exit 1
          fi

          echo "Instance ID: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # COPY DOCKER COMPOSE TO EC2
      # --------------------------------------------------------

      - name: Copy docker-compose.prod.yml
        run: |

          COMPOSE=$(base64 -w 0 infrastructure/docker-compose-prod.yml)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Update banking docker compose" \
            --parameters "commands=[
              \"mkdir -p /opt/banking\",
              \"echo $COMPOSE | base64 -d > /opt/banking/docker-compose.prod.yml\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}"

          echo "Docker Compose copied successfully."


      # --------------------------------------------------------
      # DEPLOY CONTAINERS
      # --------------------------------------------------------

      - name: Deploy containers
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}

        run: |

          COMMANDS=""

          # ----------------------------------------------------
          # Determine what needs to be deployed
          # ----------------------------------------------------

          if [ "${{ needs.changes.outputs.infrastructure }}" = "true" ]; then

            echo "Infrastructure changed -> deploy all services"
            DEPLOY_ALL=true

          elif [ "${{ needs.changes.outputs.compose }}" = "true" ]; then

            echo "Docker Compose changed -> deploy all services"
            DEPLOY_ALL=true

          else

            DEPLOY_ALL=false

          fi


          # ----------------------------------------------------
          # Build deployment commands
          # ----------------------------------------------------

          if [ "$DEPLOY_ALL" = "true" ]; then

            COMMANDS='
              docker compose -f docker-compose.prod.yml pull;
              docker compose -f docker-compose.prod.yml up -d --remove-orphans;
            '

          else

            if [ "${{ needs.changes.outputs.account }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull account-service; docker compose -f docker-compose.prod.yml up -d account-service;"
            fi

            if [ "${{ needs.changes.outputs.transaction }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull transaction-service; docker compose -f docker-compose.prod.yml up -d transaction-service;"
            fi

            if [ "${{ needs.changes.outputs.fraud }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull fraud-detection-service; docker compose -f docker-compose.prod.yml up -d fraud-detection-service;"
            fi

            if [ "${{ needs.changes.outputs.notification }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull notification-service; docker compose -f docker-compose.prod.yml up -d notification-service;"
            fi

            if [ "${{ needs.changes.outputs.payment }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull payment-service; docker compose -f docker-compose.prod.yml up -d payment-service;"
            fi

            if [ "${{ needs.changes.outputs.gateway }}" = "true" ]; then
              COMMANDS="${COMMANDS} docker compose -f docker-compose.prod.yml pull gateway-service; docker compose -f docker-compose.prod.yml up -d gateway-service;"
            fi

          fi


          # ----------------------------------------------------
          # Show deployment commands
          # ----------------------------------------------------

          echo "Deployment commands:"
          echo "$COMMANDS"


          # ----------------------------------------------------
          # Execute deployment through SSM
          # ----------------------------------------------------

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy banking application" \
            --parameters "commands=[
              \"cd /opt/banking\",
              \"test -f docker-compose.prod.yml\",
              \"docker compose -f docker-compose.prod.yml config\",
              \"aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 091708608610.dkr.ecr.eu-north-1.amazonaws.com\",
              \"$COMMANDS\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)


          echo "Deployment command ID: $COMMAND_ID"


          # ----------------------------------------------------
          # WAIT
          # ----------------------------------------------------

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"


          # ----------------------------------------------------
          # SHOW OUTPUT
          # ----------------------------------------------------

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"